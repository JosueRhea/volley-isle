<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volley Isle · Animation Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf7f3;color:#233b40;font:15px system-ui,sans-serif}main{display:grid;grid-template-columns:240px 1fr;height:100vh}aside{padding:28px 22px;background:#fffdf5;border-right:1px solid #d6e4dc;overflow:auto}small{font-weight:800;letter-spacing:.12em;color:#3c806a}h1{font-size:28px;line-height:1.1;margin:14px 0}p{line-height:1.5;color:#607570;font-size:13px}nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:24px 0}button,select{border:1px solid #ccdad1;background:#fff;border-radius:9px;padding:10px;color:inherit;cursor:pointer;font:inherit;font-size:13px}button.active{background:#285e50;color:white;border-color:#285e50}label{display:block;margin:18px 0 8px;font-size:12px;font-weight:700}input[type=range]{width:100%;accent-color:#285e50}#stage{position:relative;min-width:0}canvas{display:block;width:100%;height:100%}#status{position:absolute;bottom:18px;left:24px;font-size:12px;color:#507566}#pause{width:100%;margin-top:20px}a{color:#285e50} @media(max-width:650px){main{grid-template-columns:165px 1fr}aside{padding:18px 12px}h1{font-size:22px}nav{grid-template-columns:1fr}}
</style></head><body><main><aside><small>VOLLEY ISLE</small><h1>Meet the<br>new moves.</h1><p>Six island athletes.<br>One court. More personality.</p><nav id="actions"></nav><label for="speed">Playback speed</label><select id="speed"><option value="0.25">¼ speed</option><option value="0.5">½ speed</option><option value="1" selected>Normal</option></select><button id="pause">Pause</button><label for="scrub">Animation phase</label><input id="scrub" type="range" min="0" max="1" step="0.005" value="0"><p id="hint">Idle breathing, eye tracking, and secondary motion.</p><p><a href="/">Back to game →</a></p></aside><section id="stage"><canvas id="view"></canvas><div id="status">Loading the cast…</div></section></main><script type="module" src="/animation-lab.js"></script></body></html>
