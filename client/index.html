<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Volley Isle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Icon sprite: <svg class="ico"><use href="#i-name" /></svg> -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9.5 12 4.5l10 5-10 5z" /><path d="M6 11.5V16c0 1.6 2.7 3.2 6 3.2s6-1.6 6-3.2v-4.5" /><path d="M22 9.5v5.5" /></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" /><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.5-2.7 4" /><path d="M12 17.6h.01" /></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path fill="currentColor" d="M11 4.5 6 8.5H3v7h3l5 4z" /><path d="M15.5 9a4.2 4.2 0 0 1 0 6" /><path d="M18.5 6a8.5 8.5 0 0 1 0 12" /></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path fill="currentColor" d="M11 4.5 6 8.5H3v7h3l5 4z" /><path d="m16 9.5 5 5" /><path d="m21 9.5-5 5" /></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5.5l11-2V16" /><circle fill="currentColor" cx="6.2" cy="18" r="2.8" /><circle fill="currentColor" cx="17.2" cy="16" r="2.8" /></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4.5 12h14" /><path d="m13 6 6 6-6 6" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14" /><path d="M5 12h14" /></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" /><path d="M16 4.8a3.4 3.4 0 0 1 0 6.4" /><path d="M18.5 14.4c1.9.9 3 2.9 3 5.6" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6" /><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15l12.5-7.5z" /></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" /><path d="M12 9v4l2.5 2" /><path d="M9.5 2.5h5" /></symbol>
      <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 12a8 8 0 0 0 8 4" /><path d="M7.5 13.5a12 12 0 0 0 8.5 6.5" /><path d="M12 12a8 8 0 0 0-7.46 4.93" /><path d="M12.95 7.35a12 12 0 0 0-9.88 4.11" /><path d="M12 12a8 8 0 0 0-.54-8.93" /><path d="M15.55 15.15a12 12 0 0 0 1.38-10.18" /></symbol>
      <symbol id="i-crown" viewBox="0 0 24 24"><path fill="currentColor" d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7" /></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 20.5c0-4.2 3.6-7 8-7s8 2.8 8 7" /></symbol>
      <!-- Play-by-play feed -->
      <symbol id="i-block" viewBox="0 0 24 24"><path d="M12 2.8 4.5 5.6v5.6c0 4.7 3.2 8.4 7.5 10 4.3-1.6 7.5-5.3 7.5-10V5.6z" /><path d="m8.8 12 2.2 2.2 4.2-4.4" /></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M7 13V6.5a1.5 1.5 0 0 1 3 0V11" /><path d="M10 10.5V5a1.5 1.5 0 0 1 3 0v5.5" /><path d="M13 10.5V6a1.5 1.5 0 0 1 3 0v5" /><path d="M16 11V8.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-.6a6 6 0 0 1-4.6-2.2L4.4 15.6a1.6 1.6 0 0 1 2.4-2.1L7 13.8" /></symbol>
      <symbol id="i-kill" viewBox="0 0 24 24"><path fill="currentColor" d="M13.5 2 5 13.5h6L9.5 22 19 9.5h-6.2z" /></symbol>
      <symbol id="i-ace" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="5" /><circle fill="currentColor" cx="12" cy="12" r="1.6" /></symbol>
      <symbol id="i-tip" viewBox="0 0 24 24"><path d="M20 4c-6.5 0-12 4.5-13 11.5L5.5 20" /><path d="M20 4c.5 7-3.5 12.5-11 13" /><path d="M11 13l4-4" /></symbol>
      <symbol id="i-out" viewBox="0 0 24 24"><path d="M13 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H13" /><path d="M10 12h10" /><path d="m16.5 8 4 4-4 4" /></symbol>
      <symbol id="i-fault" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="m8.5 8.5 7 7" /><path d="m15.5 8.5-7 7" /></symbol>
      <symbol id="i-net" viewBox="0 0 24 24"><path d="M3 7h18" /><path d="M4 7v12" /><path d="M20 7v12" /><path d="M4 11h16" /><path d="M4 15h16" /><path d="M8 7v12" /><path d="M12 7v12" /><path d="M16 7v12" /></symbol>
      <symbol id="i-sfx" viewBox="0 0 24 24"><path fill="currentColor" d="m11 3 2 5.6L18.6 10.6 13 12.6 11 18.2 9 12.6 3.4 10.6 9 8.6z" /><path d="M19 15.5v5" /><path d="M16.5 18h5" /></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect fill="currentColor" x="8.5" y="2.5" width="7" height="12" rx="3.5" /><path d="M5 11a7 7 0 0 0 14 0" /><path d="M12 18v3.5" /></symbol>
      <symbol id="i-mic-off" viewBox="0 0 24 24"><rect fill="currentColor" x="8.5" y="2.5" width="7" height="12" rx="3.5" /><path d="M5 11a7 7 0 0 0 14 0" /><path d="M12 18v3.5" /><path d="m3.5 3.5 17 17" /></symbol>
      <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9" /><path d="M20 4v5h-5" /></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z" /><path d="M12 10v4.5" /><path d="M12 17.5h.01" /></symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24"><path fill="currentColor" d="M11 4.5 6 8.5H3v7h3l5 4z" /><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6" /></symbol>
    </svg>
    <div id="app"></div>

    <div id="sound">
      <div id="sound-panel" class="hidden">
        <div class="snd-title"><svg class="ico"><use href="#i-sound" /></svg><span data-i18n="set.sound"></span></div>
        <div class="snd-row">
          <label class="snd-head"><svg class="ico"><use href="#i-music" /></svg><span data-i18n="set.music"></span><input id="sound-music" type="checkbox" /></label>
          <input id="sound-music-vol" type="range" min="0" max="1" step="0.05" data-i18n-label="set.music" />
        </div>
        <div class="snd-row">
          <label class="snd-head"><svg class="ico"><use href="#i-sfx" /></svg><span data-i18n="set.sfx"></span><input id="sound-sfx" type="checkbox" /></label>
          <input id="sound-sfx-vol" type="range" min="0" max="1" step="0.05" data-i18n-label="set.sfx" />
        </div>
        <button class="snd-more" data-open="settings"><svg class="ico"><use href="#i-gear" /></svg><span data-i18n="hud.moreSettings"></span></button>
      </div>
      <button id="sound-btn" data-i18n-title="hud.sound" data-i18n-label="hud.sound" aria-expanded="false"><svg class="ico"><use href="#i-sound" /></svg></button>
    </div>
    <!-- Voice chat dock (in a room): mic button, the voice panel, and an alert when something needs fixing. -->
    <div id="voice" class="hidden">
      <div id="voice-panel" class="hidden" role="dialog" data-i18n-label="set.voice">
        <div class="snd-title">
          <svg class="ico"><use href="#i-mic" /></svg><span data-i18n="set.voice"></span>
          <input id="vp-on" type="checkbox" data-i18n-label="set.voiceOn" />
        </div>
        <div id="vp-status" class="vp-status" aria-live="polite"></div>
        <div id="vp-body">
          <div class="snd-row">
            <div class="snd-head"><svg class="ico"><use href="#i-mic" /></svg><span data-i18n="vp.mic"></span><span id="vp-mic-state" class="vp-tag"></span></div>
            <select id="vp-mic-device" data-i18n-label="vp.mic"></select>
            <div class="vp-meter" data-i18n-title="vp.level"><i id="vp-meter-fill"></i></div>
            <div class="vp-mic-actions">
              <div class="seg" id="vp-mode"><button data-value="open" data-i18n="set.micOpen"></button><button data-value="ptt" data-i18n="vp.ptt"></button></div>
              <button id="vp-mic-toggle" class="vp-small"></button>
            </div>
          </div>
          <div class="snd-row">
            <label class="snd-head" for="vp-vol"><svg class="ico"><use href="#i-sound" /></svg><span data-i18n="set.voiceVol"></span></label>
            <input id="vp-vol" type="range" min="0" max="1" step="0.05" data-i18n-label="set.voiceVol" />
            <select id="vp-out" data-i18n-label="vp.speaker"></select>
          </div>
          <div class="snd-row" id="vp-people"></div>
          <button id="vp-reconnect" class="snd-more"><svg class="ico"><use href="#i-retry" /></svg><span data-i18n="vp.reconnectAll"></span></button>
        </div>
      </div>
      <div class="vp-dock">
        <button id="voice-alert" class="hidden"></button>
        <div class="vp-mic">
          <button id="voice-btn" data-state="off"><svg class="ico"><use href="#i-mic-off" /></svg><span class="ptt-key">V</span></button>
          <button id="voice-more" aria-expanded="false" data-i18n-title="vp.open" data-i18n-label="vp.open"><svg class="ico"><use href="#i-gear" /></svg></button>
        </div>
      </div>
    </div>
    <div id="cinema"><div class="bar top"></div><div class="bar bottom"></div></div>
    <div id="hud" class="hidden">
      <div id="scoreboard">
        <div class="team t0"><span class="tname" data-i18n="team.0"></span><span id="score0" class="score">0</span></div>
        <div class="mid">
          <div class="ball-icon"></div>
          <div id="clock"></div>
        </div>
        <div class="team t1"><span id="score1" class="score">0</span><span class="tname" data-i18n="team.1"></span></div>
      </div>
      <div id="touches"></div>
      <button id="menu-btn" data-i18n-title="hud.menu">☰</button>
      <div id="room">
        <span><span data-i18n="hud.room"></span> <b id="room-code"></b></span>
        <button id="copy-link" data-i18n="hud.copyLink"></button>
      </div>
      <div id="topright">
        <div id="roster"></div>
        <div id="feed"></div>
      </div>
      <div id="banner"></div>
      <div id="hint"></div>
      <div id="controls"></div>
      <div id="prompt"></div>
      <div id="meter">
        <div class="meter-title"><span data-i18n="meter.title"></span> <span data-i18n="meter.sub"></span></div>
        <div class="meter-bar">
          <div class="zone short"><span data-i18n="meter.weak"></span></div>
          <div class="zone good"></div>
          <div class="zone perfect"><span>★</span></div>
          <div class="zone good2"></div>
          <div class="zone long"><span data-i18n="meter.long"></span></div>
          <div id="meter-needle"></div>
        </div>
      </div>
      <div id="floats"></div>
      <div id="toast"></div>
      <div id="afk" class="hidden"></div>
      <div id="tutorial" class="hidden">
        <div class="tut-head">
          <div class="tut-coach">🦀</div>
          <div>
            <div id="tut-step"></div>
            <div id="tut-title"></div>
          </div>
        </div>
        <div id="tut-text"></div>
        <div id="tut-note"></div>
        <div id="tut-dots"></div>
        <div class="tut-actions">
          <button id="tut-skip" data-i18n="tut.skip"></button>
          <div id="tut-final" class="hidden">
            <button id="tut-play" class="primary" data-i18n="tut.play"></button>
            <button id="tut-menu" data-i18n="tut.menu"></button>
          </div>
        </div>
      </div>
      <div id="prematch" class="hidden">
        <div class="pm-head">
          <span class="pm-ball"></span>
          <div>
            <div class="pm-title" data-i18n="pm.title"></div>
            <div class="pm-sub" data-i18n="pm.sub"></div>
          </div>
        </div>
        <div class="pm-teams">
          <div class="pm-team" id="pm0"></div>
          <div class="pm-vs">VS</div>
          <div class="pm-team" id="pm1"></div>
        </div>
        <h2 class="sec-label" data-i18n="pm.settings"></h2>
        <div class="pm-rules" id="pmRules"></div>
        <div class="pm-actions" id="pmActions"></div>
      </div>
      <div id="touch" class="hidden">
        <div id="stick"><div id="stick-knob"></div></div>
        <div id="touch-buttons">
          <button class="tbtn dive" data-action="tip">B<small data-i18n="touch.tip"></small></button>
          <button class="tbtn jump" data-action="jump">A<small data-i18n="touch.jump"></small></button>
          <button class="tbtn hit" data-action="hit">X<small data-i18n="touch.hit"></small></button>
        </div>
      </div>
    </div>

    <div id="lobby">
      <div class="panel">
        <h1>Volley Isle</h1>
        <div class="lang-switch seg" id="lang-switch">
          <button data-value="en">EN</button><button data-value="es">ES</button>
        </div>
        <p class="sub" data-i18n="lobby.sub"></p>

        <section class="lobby-sec">
          <h2 class="sec-label" data-i18n="lobby.you"></h2>
          <div class="picker">
            <button id="char-prev" class="arrow" data-i18n-label="lobby.prevChar">◀</button>
            <div class="char-info">
              <div id="char-name"></div>
              <div id="char-title"></div>
            </div>
            <button id="char-next" class="arrow" data-i18n-label="lobby.nextChar">▶</button>
          </div>
          <p id="char-line" class="tagline"></p>
          <label class="name-field"><span data-i18n="lobby.name"></span><input id="name" maxlength="16" data-i18n-ph="lobby.namePh" autocomplete="off" /></label>
        </section>

        <section class="lobby-sec">
          <h2 class="sec-label" data-i18n="lobby.play"></h2>
          <button id="btn-quick" class="primary cta">
            <span class="cta-ball"></span>
            <span class="cta-text"><span class="cta-title" data-i18n="lobby.quick"></span><small data-i18n="lobby.quickSub"></small></span>
            <svg class="ico cta-go"><use href="#i-arrow" /></svg>
          </button>
          <div class="friends">
            <div class="friends-label"><svg class="ico"><use href="#i-users" /></svg><span data-i18n="lobby.friends"></span></div>
            <button id="btn-create" class="with-ico"><svg class="ico plus"><use href="#i-plus" /></svg><span data-i18n="lobby.create"></span></button>
            <div class="or"><span data-i18n="lobby.or"></span></div>
            <div class="join">
              <input id="code" maxlength="4" data-i18n-ph="lobby.codePh" autocomplete="off" spellcheck="false" />
              <button id="btn-join" class="with-ico"><span data-i18n="lobby.join"></span><svg class="ico enter"><use href="#i-arrow" /></svg></button>
            </div>
          </div>
        </section>

        <p id="lobby-status" aria-live="polite"></p>
        <p id="lobby-error" role="alert"></p>
        <div id="turnstile"></div>

        <div class="lobby-extra">
          <button id="btn-tutorial"><span class="with-ico"><svg class="ico"><use href="#i-cap" /></svg><span data-i18n="lobby.tutorial"></span></span> <small id="tut-new" data-i18n="lobby.tutorialNew"></small></button>
          <button class="icon-btn spin-ico" data-open="settings" data-i18n-title="lobby.settings" data-i18n-label="lobby.settings"><svg class="ico"><use href="#i-gear" /></svg></button>
          <button class="icon-btn" data-open="help" data-i18n-title="lobby.help" data-i18n-label="lobby.help"><svg class="ico"><use href="#i-help" /></svg></button>
        </div>
        <p class="note" data-i18n="lobby.note"></p>
      </div>
    </div>

    <!-- In-game menu (Esc). The match keeps going online while it's open. -->
    <div id="pause" class="overlay hidden">
      <div class="sheet">
        <h2 data-i18n="menu.title"></h2>
        <p class="sheet-note" data-i18n="menu.note"></p>
        <button class="primary" data-close data-i18n="menu.resume"></button>
        <button class="with-ico" data-open="settings"><svg class="ico"><use href="#i-gear" /></svg><span data-i18n="lobby.settings"></span></button>
        <button class="with-ico" data-open="help"><svg class="ico"><use href="#i-help" /></svg><span data-i18n="lobby.help"></span></button>
        <button id="pause-invite" data-i18n="menu.invite"></button>
        <button id="leave" class="danger" data-i18n="menu.leave"></button>
      </div>
    </div>

    <div id="settings" class="overlay hidden">
      <div class="sheet wide">
        <h2 class="with-ico"><svg class="ico"><use href="#i-gear" /></svg><span data-i18n="set.title"></span></h2>
        <section>
          <h3 class="with-ico"><svg class="ico"><use href="#i-sound" /></svg><span data-i18n="set.sound"></span></h3>
          <label class="row"><span data-i18n="set.master"></span> <input type="range" min="0" max="1" step="0.05" data-setting="master" /></label>
          <label class="row"><span data-i18n="set.music"></span> <input type="range" min="0" max="1" step="0.05" data-setting="music" /><input type="checkbox" data-setting="musicOn" data-i18n-label="set.music" /></label>
          <label class="row"><span data-i18n="set.sfx"></span> <input type="range" min="0" max="1" step="0.05" data-setting="sfx" /><input type="checkbox" data-setting="sfxOn" data-i18n-label="set.sfx" /></label>
        </section>
        <section>
          <h3 class="with-ico"><svg class="ico"><use href="#i-mic" /></svg><span data-i18n="set.voice"></span></h3>
          <label class="row"><span data-i18n="set.voiceOn"></span> <small data-i18n="set.voiceOnSub"></small><input type="checkbox" data-setting="voiceOn" /></label>
          <label class="row"><span data-i18n="set.voiceVol"></span> <input type="range" min="0" max="1" step="0.05" data-setting="voiceVol" /></label>
          <div class="row"><span data-i18n="set.micMode"></span>
            <div class="seg" data-setting="micMode">
              <button data-value="open" data-i18n="set.micOpen"></button><button data-value="ptt" data-i18n="set.micPtt"></button>
            </div>
          </div>
        </section>
        <section>
          <h3 data-i18n="set.gameplay"></h3>
          <label class="row"><span data-i18n="set.prompts"></span> <small data-i18n="set.promptsSub"></small><input type="checkbox" data-setting="prompts" /></label>
          <label class="row"><span data-i18n="set.simpleHud"></span> <small data-i18n="set.simpleHudSub"></small><input type="checkbox" data-setting="simpleHud" /></label>
        </section>
        <section>
          <h3 data-i18n="set.graphics"></h3>
          <div class="row"><span data-i18n="set.quality"></span>
            <div class="seg" data-setting="quality">
              <button data-value="low" data-i18n="set.low"></button><button data-value="medium" data-i18n="set.medium"></button><button data-value="high" data-i18n="set.high"></button>
            </div>
          </div>
        </section>
        <section>
          <h3 data-i18n="set.language"></h3>
          <div class="row"><span>🌐</span>
            <div class="seg" data-setting="lang"><button data-value="en">English</button><button data-value="es">Español</button></div>
          </div>
        </section>
        <div class="sheet-actions">
          <button id="settings-reset" data-i18n="set.reset"></button>
          <button class="primary" data-close data-i18n="set.done"></button>
        </div>
      </div>
    </div>

    <div id="help" class="overlay hidden">
      <div class="sheet wide">
        <h2 class="with-ico"><svg class="ico"><use href="#i-help" /></svg><span data-i18n="help.title"></span></h2>
        <div id="help-controls"></div>
        <ul class="tips" data-i18n-html="help.tips"></ul>
        <div class="sheet-actions"><button class="primary" data-close data-i18n="help.gotIt"></button></div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
